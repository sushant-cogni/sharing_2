<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch APIs</title>
    <link rel="stylesheet" href="./css/bootstrap.min.css" crossorigin="anonymous">
<script>
        let posts = function ()
        {
            var no=document.querySelector("#no").value;
            console.log(no);
            var url='https://jsonplaceholder.typicode.com/comments?postId='+no;
            fetch(url).then(responseType => responseType.json())
                        .then(result => {
                            console.log(typeof(result));
                            console.log(result.length);

                            for(var i=0;i<result.length;i++)
                            {
                                var table=document.getElementById('tblComments');
                                var row=table.insertRow(0);
                                var cell1=row.insertCell(0);
                                var cell2=row.insertCell(1);
                                var cell3=row.insertCell(2);
                                var cell4=row.insertCell(3);
                                var cell5=row.insertCell(4);

                                cell2.innerHTML=result[i].id;
                                cell2.innerHTML=result[i].postId;
                                cell3.innerHTML=result[i].name;
                                cell4.innerHTML=result[i].email;
                                cell5.innerHTML=result[i].body;

                                

                            }
                        } )
                        .catch(err => {
                            alert("Failed");
                            console.log(err);
                        });

            
        }
    </script>
</head>
<body class="container ">

    <input id="no" type="number" class="form-control col-6 my-5 mx-2 fluid">
    <button onclick="posts()" class="  btn btn-info col-4"> Show Post</button>
    <table border="1" id="tblComments" class="table table-success table-striped my-5"></table>

    

</body>
</html>
