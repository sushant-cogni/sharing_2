<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
    <style>
        ul {
      list-style-type: square; /* circle, disc, none */
      padding-left: 20px;
    }
    </style>
</head>
<body>
    <ul>
        <li>Apples</li>
        <li>Bananas</li>
    </ul>

    <ol type="i"> 
        <li>First Item</li>
        <li>Second Item</li>
    </ol>

    <ul>
        <li>First Item</li>
        <li>Second Item</li>
        <li>Fruits
            <ul> 
                <li>Apple</li>
                <li>Mango</li>
            </ul>
        </li>
    </ul>
</body>
</html>
