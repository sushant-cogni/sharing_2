<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Formatting</title>
</head>
<body>
    <p>
        <b>This is BOLD</b><br>
        <strong>This is Strong</strong><br>
        <i>This is italic</i><br>
        <em>This is emphasize text</em><br>
        This is <mark> mark </mark> paragraph<br>
        <u>This is Underline text</u><br>

        H<sub>2</sub>o<br>
        10<sup>th</sup>
    </p>
</body>
</html>
